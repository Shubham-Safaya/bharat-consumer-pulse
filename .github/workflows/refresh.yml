name: Monthly pulse refresh
on:
  schedule:
    - cron: "30 8 1 * *"   # 1st of month, 08:30 UTC (India data is monthly)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/refresh.py
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
      - run: |
          git config user.name "pulse-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: monthly pulse $(date -u +%F) [skip ci]"
          git push
